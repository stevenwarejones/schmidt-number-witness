name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The sharp verifier alone is standard-library only, so it runs before any install.
      - name: Sharp Schmidt-number-two certificate (no dependencies)
        run: python proofs/verify_sharp_qubit.py

      - name: Install verification dependencies
        run: python -m pip install --quiet -r requirements.txt

      # run_checks.py needs SymPy for the face-dimension verifier, so it comes after install.
      - name: Active exact certificate chain
        run: python run_checks.py

      - name: Adversarial tests and the optimized-execution regression
        run: |
          python tests/adversarial_sharp_checks.py
          python tests/test_standalone_optimized.py

      - name: Exact Pauli reconstruction (exact; needs SymPy)
        run: python tests/check_sharp_pauli.py

      - name: Discovery input/output paths resolve (no solver launched)
        run: python tests/test_research_paths.py

      - name: Prior-art corollary (bounds the novelty claim; standard library only)
        run: python proofs/verify_m3322_corollary.py

      - name: Comparison with the standard I3322/M3322 score thresholds
        run: python proofs/verify_novelty_comparison.py

      - name: Comparison with the correlation-weighted I3322(c) family, all c >= 1
        run: python proofs/verify_i3322_family.py

      # A scoped comparison, not a proof gate: no claim in proofs/ depends on it.
      - name: Four-setting catalogue fold search (comparison only)
        run: python research/audit_catalog_folds.py

      - name: Comparison corruption tests
        run: python tests/test_comparison_acceptance.py

      # The checkers must reject the specific defects they were written for.  These were
      # previously run as external sweeps and only reported in commit messages.
      - name: Checker mutation regressions
        run: python tests/test_checker_mutations.py

      - name: Documentation paths and entry-point coverage
        run: python tests/test_docs_consistency.py

      - name: Legacy routing (historical; supports no current claim)
        run: python research/legacy/verify_routing.py --legacy-routing

      - name: Manifest content and coverage
        run: python manifest.py check

      - name: Independent SOS cross-check (NUMERICAL corroboration, not an exact proof)
        run: python tests/verify_sos_independent.py

      # Different mathematics from proofs/, not a second copy: local models built from
      # scratch by Fine's theorem, and the Born rule evaluated with full 9x9 operators.
      - name: Independent reconstruction of the geometry and the realization
        run: python tests/verify_facet_independent.py

      # Exercise the distribution a reader actually downloads, not just its hashes.
      - name: Snapshot builds, and its hashes verify without Git
        run: |
          python make_snapshot.py
          mkdir -p /tmp/snap && tar -xzf build/verification-snapshot-*.tar.gz -C /tmp/snap
          cd /tmp/snap/verification-snapshot-* && python manifest.py verify-archive

      - name: The proof chain runs INSIDE the extracted snapshot
        run: |
          cd /tmp/snap/verification-snapshot-*
          python run_checks.py
          python tests/verify_facet_independent.py

      # A visitor should not need a TeX install to read a typeset paper.
      - name: Build the manuscript
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-fonts-recommended fonts-dejavu
          bash paper/build.sh
          pdfinfo build/paper/manuscript.pdf

      - name: Upload the verification snapshot and the paper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-snapshot-and-paper
          path: |
            build/verification-snapshot-*.tar.gz
            build/paper/manuscript.pdf
          if-no-files-found: warn
